*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f1;--white:#ffffff;--ink:#1a1a1a;--mid:#6b6b6b;
  --pale:#e4e1db;--accent:#2c4a7c;--accent-light:#eaeff7;
  --font-serif:Georgia,'Times New Roman',serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.site-header{position:sticky;top:0;z-index:100;background:var(--white);border-bottom:1px solid var(--pale);padding:12px 16px}
.site-header h1{font-family:var(--font-serif);font-size:16px;font-weight:normal;letter-spacing:0.03em}
.site-header p{font-size:11px;color:var(--mid);margin-top:1px;letter-spacing:0.04em}
.container{padding:14px 14px 48px;max-width:580px;margin:0 auto}
.card{background:var(--white);border-radius:3px;border:1px solid var(--pale);margin-bottom:10px;overflow:hidden}
.card-top{display:flex;align-items:flex-start}
.jacket-wrap{width:100px;min-width:100px;background:var(--white);display:flex;align-items:flex-start;justify-content:center;padding:10px 8px 10px 10px;align-self:flex-start}
.jacket-wrap img,.jacket-placeholder{width:82px;height:82px;object-fit:contain;display:block}
.jacket-placeholder{display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:2px}
.jacket-placeholder span{font-size:28px;opacity:0.22}
.card-body{flex:1;padding:10px 12px;min-width:0}
.card-meta{display:flex;flex-direction:column;gap:1px;margin-bottom:6px;width:100%}
.year-row{display:flex;align-items:baseline;gap:6px;width:100%}
.am-badge{margin-left:auto}
.year-label{font-size:9px;letter-spacing:0.07em;text-transform:uppercase;color:var(--mid);width:52px;flex-shrink:0}
.year-rec{font-family:var(--font-serif);font-size:21px;color:var(--accent);font-weight:normal;line-height:1}
.year-rel{font-family:var(--font-serif);font-size:16px;color:var(--mid);font-weight:normal;line-height:1}
.label-inline{font-size:11px;color:var(--mid);letter-spacing:0.03em}
.album-title{font-family:var(--font-serif);font-size:15px;font-weight:normal;color:var(--ink);line-height:1.3;margin-bottom:6px}
.venue{font-size:11px;color:var(--mid);line-height:1.55;padding-left:0;margin-bottom:9px}
.tracks-detail summary{display:inline-flex;align-items:center;gap:5px;cursor:pointer;list-style:none;user-select:none;-webkit-user-select:none;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-light);border:1px solid #c8d5ea;border-radius:3px;padding:3px 9px 3px 7px;letter-spacing:0.03em}
.tracks-detail summary::-webkit-details-marker{display:none}
.tracks-detail[open] summary .icon-plus{display:none}
.tracks-detail:not([open]) summary .icon-minus{display:none}
.tracks-detail[open] .tracks{animation:slideDown 0.5s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.tracks{font-size:11px;color:var(--mid);margin-top:8px;line-height:1}
.track-item{padding:3px 0;border-bottom:1px solid #f0ede8}
.track-item:last-child{border-bottom:none}
.footer{text-align:center;font-size:11px;color:var(--mid);padding:16px 0 8px;letter-spacing:0.05em}

/* モーダル */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active {
  display: flex;
}
.modal-img {
  width: 85vw;
  height: 85vw;
  max-width: 85vh;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 3px;
  animation: modalIn 0.2s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
.jacket-wrap img {
  cursor: zoom-in;
}

/* Apple Music バッジ */
.am-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  text-decoration: none;
  opacity: 0.6;
  transition: opacity 0.15s;
}
.am-link:hover { opacity: 1; }
.am-logo {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  object-fit: contain;
}
.am-text {
  font-size: 9px;
  letter-spacing: 0.04em;
  color: var(--mid);
  font-family: var(--font-sans);
  white-space: nowrap;
}
</style>

function makeCard(a){
  const img=a.img
    ?`<img src="${a.img}" alt="${a.album}" loading="lazy" onclick="openModal(this.src,this.alt)" style="cursor:zoom-in">`
    :`<div class="jacket-placeholder"><span>🎹</span></div>`;
  const trackItems=a.tracks.map(t=>`<div class="track-item">${t}</div>`).join('');
  const tracksHtml=a.tracks.length>0
    ?`<details class="tracks-detail"><summary><i class="icon icon-plus" style="font-style:normal">＋</i><i class="icon icon-minus" style="font-style:normal">−</i> 収録曲</summary><div class="tracks">${trackItems}</div></details>`
    :'';
  return`<div class="card"><div class="card-top"><div class="jacket-wrap">${img}</div><div class="card-body"><div class="card-meta"><div class="year-row"><span class="year-label">Recorded</span><span class="year-rec">${a.rec}</span><span class="am-badge" data-album="${a.album}"></span></div><div class="year-row"><span class="year-label">Released</span><span class="year-rel">${a.rel}</span><span class="label-inline"> / ${a.label}</span></div></div><div class="album-title">${a.album}</div><div class="venue">${a.venue}</div>${tracksHtml}</div></div></div>`;
}
const app=document.getElementById('app');
app.innerHTML=albums.map(a=>makeCard(a)).join('')+'<div class="footer">22 albums · 1971–2025</div>';
</script>

<script>
function openModal(src, alt) {
  document.getElementById('modal-img').src = src;
  document.getElementById('modal-img').alt = alt;
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});
</script>

<script>
function loadAppleMusicLinks() {
  const badges = document.querySelectorAll('.am-badge');
  badges.forEach(badge => {
    const album = badge.dataset.album;
    const storeUrl = AM_URLS[album];
    if (storeUrl) {
      badge.innerHTML = `<a class="am-link" href="${storeUrl}" target="_blank" rel="noopener" title="Apple Music">
        <img class="am-logo" src="${AM_LOGO}" alt="Apple Music">
      </a>`;
    }
  });
}
loadAppleMusicLinks();
</script>
</body>
</html>
